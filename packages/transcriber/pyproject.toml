[project]
name = "theopentranscribe"
version = "0.1.0"
description = "TheOpenTranscribe transcription engine and CLI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai==2.44.0",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[project.scripts]
theopentranscribe = "transcriber.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["transcriber*"]
